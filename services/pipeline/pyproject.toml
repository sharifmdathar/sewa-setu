[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Sewa Setu agentic scrutiny pipeline (Track A)"
requires-python = ">=3.11"
dependencies = ["fastapi", "pydantic>=2", "httpx", "openai", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "uvicorn"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["rules/rules.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
